name: Actualiser les offres

on:
  schedule:
    - cron: "0 5 * * *"   # tous les jours vers 6h/7h heure de Paris
  workflow_dispatch:       # lancement manuel possible

permissions:
  contents: write

jobs:
  actualiser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r alternance-web/requirements.txt

      - name: Récupérer et filtrer les offres
        working-directory: alternance-web
        env:
          LBA_API_KEY: ${{ secrets.LBA_API_KEY }}
        run: python main.py

      - name: Exporter offres.json
        working-directory: alternance-web
        run: python export_json.py

      - name: Publier si les offres ont changé
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add alternance-front/offres.json
          git diff --staged --quiet || (git commit -m "Mise à jour des offres" && git push)